<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2547">
<title>Certificate Generator – Miss Wafaa Awad</title>
<link rel="stylesheet" href="fonts.css">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="vendor/html2canvas.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<style>
:root{--bg:#eef1f6;--panel:#fff;--ink:#0f2547;--muted:#5b6780;--line:#d5dbe7;--gold:#b8923a;--navy:#0f2547;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--panel:#141d30;--ink:#e8edf7;--muted:#9aa7c0;--line:#2a3652}}
:root[data-theme="dark"]{--bg:#0b1220;--panel:#141d30;--ink:#e8edf7;--muted:#9aa7c0;--line:#2a3652}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;overflow-x:hidden}
.app{max-width:1400px;margin:0 auto;padding:16px;display:grid;gap:16px}
@media(min-width:1000px){.app{grid-template-columns:340px 1fr;align-items:start;padding:24px}.panel{position:sticky;top:16px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h1{font-size:18px;margin:0 0 4px}.panel p{margin:0 0 14px;color:var(--muted);font-size:13px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
textarea{resize:vertical;min-height:70px}
input[type=color]{height:48px;padding:4px;cursor:pointer}
.btns{display:grid;gap:10px;margin-top:18px}
button{font:inherit;font-weight:600;font-size:15px;min-height:48px;border-radius:10px;border:1px solid var(--navy);cursor:pointer;padding:0 14px}
.pri{background:var(--navy);color:#fff}.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.sec{background:transparent;color:var(--ink);border-color:var(--line)}
button:disabled{opacity:.6;cursor:wait}
#status{min-height:20px;font-size:13px;color:var(--muted);margin-top:10px}
@media(max-width:999px) and (min-height:640px){.preview{order:-1;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0}}
.preview{min-width:0}
#fit{width:100%;position:relative;box-shadow:0 10px 40px rgba(15,37,71,.25);border-radius:2px;overflow:hidden;background:#fff}
#scaler{position:absolute;left:0;top:0;transform-origin:0 0}

/* ---------- Certificate (fixed 1123 x 794 = A4 landscape @96dpi) ---------- */
.cert{width:1123px;height:794px;background:#fff;position:relative;overflow:hidden;color:#0f2547;font-family:'Montserrat',sans-serif;
 background-image:radial-gradient(circle at 50% 0,#f4f8ff 0,#fff 55%)}
.cert .b1{position:absolute;inset:22px;border:5px solid #0f2547}
.cert .b2{position:absolute;inset:36px;border:1.5px solid #b8923a}
.cert .b3{position:absolute;inset:44px;border:1px solid #c9d6ec}
.cert .corner{position:absolute;width:110px;height:110px}
.cert .c-tl{left:30px;top:30px}.cert .c-tr{right:30px;top:30px;transform:scaleX(-1)}
.cert .c-bl{left:30px;bottom:30px;transform:scaleY(-1)}.cert .c-br{right:30px;bottom:30px;transform:scale(-1,-1)}
.cert .content{position:absolute;inset:60px 90px 52px;display:flex;flex-direction:column;align-items:center;text-align:center}
.label{font-size:17px;letter-spacing:7px;font-weight:600;color:#b8923a;margin-top:6px}
.orn{display:flex;align-items:center;gap:10px;margin:10px 0 2px}
.orn i{display:block;width:90px;height:1.5px;background:#b8923a}
.title{font-family:'Playfair Display',serif;font-weight:900;font-size:78px;letter-spacing:5px;line-height:1.1;color:#0f2547;margin:2px 0 6px;max-width:100%}
.sub{font-size:19px;color:#3d4c6b;letter-spacing:1px}
.namebox{width:830px;height:112px;display:flex;align-items:center;justify-content:center;margin-top:6px;border-bottom:2px solid #b8923a;position:relative}
.name{font-family:'Playfair Display','Amiri',serif;font-weight:700;font-size:72px;letter-spacing:3px;color:#9b1c31;white-space:nowrap;line-height:1.25;padding:0 10px}
.name[dir=rtl],.name.ar{font-family:'Amiri',serif;font-weight:700;letter-spacing:0;text-transform:none}
.ach{font-size:19px;line-height:1.55;color:#33415f;max-width:720px;margin:14px 0 8px}
.mot{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:25px;color:#b8923a;margin-bottom:auto}
.row{width:100%;display:flex;justify-content:space-between;align-items:flex-end;margin-top:6px}
.col{width:280px;text-align:center}
.col .ln{border-top:1.5px solid #0f2547;padding-top:7px;font-size:13px;letter-spacing:2px;color:#3d4c6b}
.date{font-size:19px;font-weight:500;height:26px;color:#0f2547}
.teacher{font-family:'Playfair Display',serif;font-weight:700;font-size:25px;letter-spacing:3px;height:34px;color:#0f2547}
.seal{width:112px;height:112px;margin-bottom:-4px}
.foot{font-size:14.5px;letter-spacing:2px;color:#33415f;margin-top:12px;font-weight:500}
.wm{position:absolute;left:50%;top:165px;width:470px;height:470px;margin-left:-235px}
.dc{position:absolute;width:88px}.dc.l{left:56px}.dc.r{right:56px}
.bub{height:52px;border:2px solid #b8923a;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:19px;color:#0f2547}
.bub::after{content:'';position:absolute;bottom:-9px;left:18px;width:14px;height:14px;background:#fff;border-right:2px solid #b8923a;border-bottom:2px solid #b8923a;transform:rotate(45deg)}
.dc.r.bub::after{left:auto;right:18px}
.tile{height:64px;background:#0f2547;border:2px solid #b8923a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:900;font-size:26px;letter-spacing:1px;color:#d9b865;box-shadow:4px 4px 0 #d9b865}
</style>
</head>
<body>
<div class="app">
 <section class="panel" aria-label="Customize certificate">
  <h1>Certificate Generator</h1>
  <p>Type a name – the preview updates instantly.</p>
  <label for="in-name">Student Name</label>
  <input id="in-name" type="text" placeholder="e.g. Sara Ahmed / سارة أحمد" autocomplete="off">
  <label for="in-color">Name Color</label>
  <input id="in-color" type="color" value="#9b1c31">
  <label for="in-date">Date (optional)</label>
  <input id="in-date" type="date">
  <label for="in-title">Certificate Title</label>
  <input id="in-title" type="text">
  <label for="in-head">Main Heading</label>
  <input id="in-head" type="text">
  <label for="in-ach">Achievement Message</label>
  <textarea id="in-ach"></textarea>
  <label for="in-mot">Motivational Message</label>
  <input id="in-mot" type="text">
  <div class="btns">
   <button class="pri" id="b-pdf">Download Certificate PDF</button>
   <button class="gold" id="b-png">Download Certificate PNG</button>
   <button class="sec" id="b-reset">Reset</button>
  </div>
  <div id="status" role="status"></div>
 </section>

 <section class="preview">
  <div id="fit"><div id="scaler">
   <div class="cert" id="cert">
    <div class="b1"></div><div class="b2"></div><div class="b3"></div>
    <svg class="wm" viewBox="-100 -100 200 200" fill="none" stroke="rgba(15,37,71,.07)" stroke-width="1"><circle r="95"/><circle r="80"/><circle r="64" stroke-dasharray="2 4"/><path d="M0-60L14-18 58-18 22 8 36 50 0 24-36 50-22 8-58-18-14-18z" fill="rgba(184,146,58,.08)" stroke="none"/></svg>
    <svg class="dc l" style="top:236px;height:56px" viewBox="0 0 88 56" fill="none" stroke="#b8923a" stroke-width="2.5"><path d="M44 6L4 22l40 16 40-16z" fill="#0f2547"/><path d="M20 30v14c14 10 34 10 48 0V30" fill="#fff"/><path d="M82 24v20"/><circle cx="82" cy="47" r="3" fill="#b8923a"/></svg>
    <svg class="dc l" style="top:344px;height:64px" viewBox="0 0 88 64" fill="none" stroke="#b8923a" stroke-width="2.5"><path d="M44 12C32 4 16 4 4 8v44c12-4 28-4 40 4 12-8 28-8 40-4V8C72 4 56 4 44 12z" fill="#fff"/><path d="M44 12v44"/><path d="M14 20c8-2 16-1 24 3M14 30c8-2 16-1 24 3M50 23c8-4 16-5 24-3M50 33c8-4 16-5 24-3" stroke-width="1.5"/></svg>
    <svg class="dc l" style="top:452px;height:50px" viewBox="0 0 88 50" fill="#b8923a"><path d="M22 4l4 10 11 .5-8.5 7 3 10.5L22 26l-9.5 6 3-10.5-8.5-7L18 14z"/><path d="M62 16l3 7.5 8 .4-6.3 5 2.2 7.7-6.9-4.4-6.9 4.4 2.2-7.7-6.3-5 8-.4z" opacity=".6"/></svg>
    <svg class="dc r" style="top:230px;height:64px" viewBox="0 0 88 64" fill="none" stroke="#b8923a" stroke-width="2.2"><circle cx="44" cy="30" r="26" fill="#fff"/><ellipse cx="44" cy="30" rx="11" ry="26"/><path d="M18 30h52M22 17h44M22 43h44"/><path d="M26 58h36M44 56v2"/></svg>
    <svg class="dc r" style="top:344px;height:64px" viewBox="0 0 88 64" fill="none" stroke="#b8923a" stroke-width="2.5"><path d="M18 54l4-14L62 6l14 12-40 34z" fill="#fff"/><path d="M22 40l14 12M56 12l14 12"/><path d="M18 54l4-14 10 8z" fill="#0f2547" stroke="none"/></svg>
    <svg class="dc r" style="top:452px;height:64px" viewBox="0 0 88 64" fill="none" stroke="#b8923a" stroke-width="2.2"><path d="M30 2l14 22 14-22" fill="#0f2547"/><circle cx="44" cy="40" r="18" fill="#fff"/><path d="M44 30l3.5 7 7.5 1-5.5 5.2 1.4 7.6-6.9-3.8-6.9 3.8 1.4-7.6-5.5-5.2 7.5-1z" fill="#b8923a" stroke="none"/></svg>
    <svg class="corner c-tl" viewBox="0 0 110 110" fill="none" stroke="#b8923a"><path d="M4 106V4h102" stroke-width="3"/><path d="M16 94V16h78" stroke-width="1.2"/><path d="M30 30l9 9-9 9-9-9z" fill="#b8923a" stroke="none"/></svg>
    <svg class="corner c-tr" viewBox="0 0 110 110" fill="none" stroke="#b8923a"><path d="M4 106V4h102" stroke-width="3"/><path d="M16 94V16h78" stroke-width="1.2"/><path d="M30 30l9 9-9 9-9-9z" fill="#b8923a" stroke="none"/></svg>
    <svg class="corner c-bl" viewBox="0 0 110 110" fill="none" stroke="#b8923a"><path d="M4 106V4h102" stroke-width="3"/><path d="M16 94V16h78" stroke-width="1.2"/><path d="M30 30l9 9-9 9-9-9z" fill="#b8923a" stroke="none"/></svg>
    <svg class="corner c-br" viewBox="0 0 110 110" fill="none" stroke="#b8923a"><path d="M4 106V4h102" stroke-width="3"/><path d="M16 94V16h78" stroke-width="1.2"/><path d="M30 30l9 9-9 9-9-9z" fill="#b8923a" stroke="none"/></svg>
    <div class="content">
     <div class="label" data-f="title"></div>
     <div class="orn"><i></i><svg width="18" height="18" viewBox="-10 -10 20 20"><path id="st" d="M0-9L2.6-3 9-2.8 4-.9 5.6 7 0 3.4-5.6 7-4-.9-9-2.8-2.6-3z" fill="#b8923a"/></svg><i></i></div>
     <div class="title" data-f="head"></div>
     <div class="sub">This certificate is proudly presented to</div>
     <div class="namebox"><div class="name" data-f="name"></div></div>
     <div class="ach" data-f="ach"></div>
     <div class="mot" data-f="mot"></div>
     <div class="row">
      <div class="col"><div class="date" data-f="date"></div><div class="ln">DATE</div></div>
      <svg class="seal" viewBox="-60 -60 120 120" id="seal">
       <circle r="40" fill="#0f2547"/><circle r="36" fill="none" stroke="#d9b865" stroke-width="1.5"/>
       <path d="M-17 -2L0-11 17-2 0 7z" fill="#d9b865"/><path d="M-10 3v8c6 5 14 5 20 0V3L0 8z" fill="#d9b865"/><path d="M17-2v13" stroke="#d9b865" stroke-width="1.5"/>
       <g id="laurel" fill="#b8923a"></g>
      </svg>
      <div class="col"><div class="teacher">MISS WAFAA AWAD</div><div class="ln">AWARDED BY</div></div>
     </div>
     <div class="foot">Your Hard Work Today Builds Your Success Tomorrow.</div>
    </div>
   </div>
  </div></div>
 </section>
</div>

<script>
const D={name:'',color:'#9b1c31',date:'',title:'CERTIFICATE OF ACHIEVEMENT',head:'WELL DONE!',
 ach:'In recognition of your outstanding effort, dedication, and progress in learning English.',
 mot:'Keep Learning, Keep Growing, Keep Shining!'};
const PH='[STUDENT NAME]';
const $=id=>document.getElementById(id);
const ids={name:'in-name',color:'in-color',date:'in-date',title:'in-title',head:'in-head',ach:'in-ach',mot:'in-mot'};
const cert=$('cert');

// laurel wreath around seal
(function(){let s='';for(const side of[-1,1])for(let i=0;i<9;i++){const a=(200+i*17)*Math.PI/180*1;const ang=side*(Math.PI/2+0.35+i*0.3);const r=47;
 const x=Math.sin(side*(0.5+i*0.3))*r*1,y=Math.cos(side*(0.5+i*0.3))*r;
 s+=`<ellipse cx="${(side*Math.sin(0.45+i*0.32)*r).toFixed(1)}" cy="${(Math.cos(0.45+i*0.32)*r).toFixed(1)}" rx="3" ry="7" transform="rotate(${(side*(-(0.45+i*0.32)*57.3+180)).toFixed(0)} ${(side*Math.sin(0.45+i*0.32)*r).toFixed(1)} ${(Math.cos(0.45+i*0.32)*r).toFixed(1)})"/>`}
 $('laurel').innerHTML=s})();

function fitName(root){
 const el=root.querySelector('[data-f=name]'),box=el.parentElement;
 el.style.whiteSpace='nowrap';let fs=72;el.style.fontSize=fs+'px';
 while(el.scrollWidth>box.clientWidth-20&&fs>26){fs-=2;el.style.fontSize=fs+'px'}
 if(el.scrollWidth>box.clientWidth-20){el.style.whiteSpace='normal';el.style.lineHeight='1.1'}
}
function fmtDate(v){if(!v)return'';const d=new Date(v+'T00:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}
function render(){
 const v=k=>$(ids[k]).value;
 const set=(k,t)=>cert.querySelector(`[data-f=${k}]`).textContent=t;
 const nm=v('name').trim();
 set('name',nm||PH);
 const n=cert.querySelector('[data-f=name]');
 const ar=/[\u0600-\u06FF]/.test(nm);
 n.dir=ar?'rtl':'ltr';n.style.color=v('color');n.classList.toggle('ar',ar);
 set('title',v('title').toUpperCase());set('head',v('head'));set('ach',v('ach'));set('mot',v('mot'));set('date',fmtDate(v('date')));
 fitName(cert);
}
function reset(){for(const k in ids)$(ids[k]).value=D[k];render();msg('')}
function msg(t){$('status').textContent=t}
Object.values(ids).forEach(id=>$(id).addEventListener('input',render));
$('b-reset').onclick=reset;

// responsive preview scaling
function scale(){const w=$('fit').clientWidth,s=w/1123;$('scaler').style.transform=`scale(${s})`;$('fit').style.height=(794*s)+'px'}
new ResizeObserver(scale).observe($('fit'));

async function capture(){
 await document.fonts.ready;
 await Promise.all(['700 20px Amiri','700 20px "Playfair Display"','italic 600 20px "Playfair Display"','900 20px "Playfair Display"','500 20px Montserrat'].map(f=>document.fonts.load(f,'Aa أ')));
 const stage=document.createElement('div');stage.style.cssText='position:fixed;left:-20000px;top:0;width:1123px;height:794px';
 const clone=cert.cloneNode(true);stage.appendChild(clone);document.body.appendChild(stage);
 fitName(clone);
 try{
  const c=await html2canvas(clone,{scale:3508/1123,backgroundColor:'#ffffff',useCORS:true,logging:false,width:1123,height:794});
  const out=document.createElement('canvas');out.width=3508;out.height=2480;
  const g=out.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,3508,2480);g.drawImage(c,0,0,3508,2480);
  return out;
 }finally{stage.remove()}
}
function fname(ext){const n=$(ids.name).value.trim().replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,'_');return`Certificate_${n}.${ext}`}
async function run(btn,label,fn){
 if(!$(ids.name).value.trim()){msg('Please enter the student name first.');$(ids.name).focus();return}
 if(!window.html2canvas||(label==='PDF'&&!window.jspdf)){msg('Export tools could not load. Check your internet connection and reload the page.');return}
 const bs=[...document.querySelectorAll('button')];bs.forEach(b=>b.disabled=true);msg('Preparing '+label+'…');
 try{const u=await fn();$('status').innerHTML=label+' ready ✓ – if it did not save, <a href="'+u+'" target="_blank" rel="noopener" style="color:var(--gold);font-weight:600">tap here to open it</a>'}catch(e){console.error(e);msg('Sorry, export failed. Please try again.')}
 bs.forEach(b=>b.disabled=false);
}
async function save(blob,name){const url=URL.createObjectURL(blob);const touch=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform));try{const f=new File([blob],name,{type:blob.type});if(touch&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return url}}catch(e){if(e&&e.name==='AbortError')return url}const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();return url}
$('b-png').onclick=()=>run($('b-png'),'PNG',async()=>{
 const c=await capture();const b=await new Promise(r=>c.toBlob(r,'image/png'));return save(b,fname('png'))});
$('b-pdf').onclick=()=>run($('b-pdf'),'PDF',async()=>{
 const c=await capture();const {jsPDF}=window.jspdf;
 const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4',compress:true});
 pdf.addImage(c.toDataURL('image/jpeg',0.95),'JPEG',0,0,297,210);
 return save(pdf.output('blob'),fname('pdf'))});

reset();scale();
document.fonts.ready.then(render);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
